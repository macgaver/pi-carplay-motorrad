<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="330" rx="16" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b4b8a"/>
    </marker>
  </defs>
  <!-- iPhone -->
  <rect x="40" y="60" width="74" height="132" rx="14" fill="#1d1d1f"/>
  <rect x="47" y="72" width="60" height="104" rx="5" fill="#ff40aa"/>
  <text x="77" y="222" text-anchor="middle" font-size="18" font-weight="700" fill="#1d1d1f">iPhone</text>
  <text x="77" y="244" text-anchor="middle" font-size="13" fill="#555">dans votre poche</text>
  <!-- dongle -->
  <rect x="268" y="106" width="96" height="40" rx="8" fill="#2b2b2b"/>
  <rect x="364" y="116" width="22" height="20" rx="2" fill="#a0a0a8"/>
  <text x="316" y="131" text-anchor="middle" font-size="12" fill="#fff">Carlinkit</text>
  <text x="326" y="222" text-anchor="middle" font-size="18" font-weight="700" fill="#1d1d1f">Adaptateur CarPlay</text>
  <!-- Pi -->
  <rect x="436" y="86" width="140" height="92" rx="8" fill="#2e8b57"/>
  <rect x="452" y="100" width="34" height="34" rx="3" fill="#cfd8d3"/>
  <circle cx="556" cy="104" r="5" fill="#7CFC00"/>
  <text x="506" y="166" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Raspberry Pi 4</text>
  <text x="506" y="222" text-anchor="middle" font-size="18" font-weight="700" fill="#1d1d1f">Boîtier Pi</text>
  <text x="506" y="244" text-anchor="middle" font-size="13" fill="#555">+ carte microSD</text>
  <!-- battery -->
  <rect x="456" y="276" width="100" height="36" rx="7" fill="#f2f2f5" stroke="#888"/>
  <rect x="470" y="285" width="58" height="18" rx="3" fill="#2e8b57"/>
  <text x="590" y="299" font-size="14" fill="#333">Batterie USB (ou courant de la moto)</text>
  <line x1="506" y1="276" x2="506" y2="252" stroke="#888" stroke-width="3" stroke-dasharray="2 4"/>
  <!-- TFT -->
  <rect x="704" y="70" width="220" height="112" rx="12" fill="#1d1d1f"/>
  <rect x="714" y="80" width="200" height="92" rx="6" fill="#5a2a8a"/>
  <text x="814" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#ffd640">CarPlay</text>
  <text x="814" y="146" text-anchor="middle" font-size="12" fill="#fff">sur l'écran de la moto</text>
  <text x="814" y="222" text-anchor="middle" font-size="18" font-weight="700" fill="#1d1d1f">Écran BMW (TFT)</text>
  <text x="814" y="244" text-anchor="middle" font-size="13" fill="#555">10.25" Connectivity</text>
  <!-- links -->
  <line x1="126" y1="126" x2="258" y2="126" stroke="#5b4b8a" stroke-width="3" stroke-dasharray="8 6" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="192" y="110" text-anchor="middle" font-size="13" fill="#5b4b8a">CarPlay sans fil</text>
  <line x1="388" y1="126" x2="434" y2="126" stroke="#5b4b8a" stroke-width="4"/>
  <text x="411" y="110" text-anchor="middle" font-size="13" fill="#5b4b8a">USB</text>
  <line x1="586" y1="126" x2="694" y2="126" stroke="#5b4b8a" stroke-width="3" stroke-dasharray="8 6" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="640" y="104" text-anchor="middle" font-size="13" fill="#5b4b8a">Bluetooth +</text>
  <text x="640" y="118" text-anchor="middle" font-size="13" fill="#5b4b8a">Wi-Fi Direct</text>
  <text x="480" y="34" text-anchor="middle" font-size="16" fill="#333">Aucun câble vers la moto ni le téléphone : seul l'adaptateur se branche au Pi</text>
</svg>
