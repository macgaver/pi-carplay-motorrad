<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- tftpush (root) stands in for UPower and ModemManager so PipeWire's hands-free link
     tells the bike a battery level and signal strength (tftpush/phone_status.py).
     The Pi runs neither real daemon; if one is installed it owns the name first and wins. -->
<busconfig>
  <policy user="root">
    <allow own="org.freedesktop.UPower"/>
    <allow own="org.freedesktop.ModemManager1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.freedesktop.UPower"/>
    <allow send_destination="org.freedesktop.ModemManager1"/>
  </policy>
</busconfig>
