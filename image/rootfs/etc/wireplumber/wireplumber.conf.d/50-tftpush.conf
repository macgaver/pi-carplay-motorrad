# Headless: nobody is logged in on a seat, so do not wait for one before using Bluetooth.
wireplumber.profiles = {
  main = {
    monitor.bluez.seat-monitoring = disabled
  }
}

# Offer what a phone offers (media source + hands-free gateway), and accept the reverse.
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_source a2dp_sink hfp_ag hfp_hf ]
  bluez5.hfphsp-backend = "native"
  # Take signal strength / service for the bike's status bar from ModemManager. The Pi has
  # no modem; tftpush publishes the iPhone's values under that name (tftpush/phone_status.py).
  bluez5.hfphsp-backend-native-modem = "any"
}
