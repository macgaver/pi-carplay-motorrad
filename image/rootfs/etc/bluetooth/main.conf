# bmw-carplay image: look like a phone and stay pairable without a human at the Pi.
# The stock file is kept next to this one as main.conf.stock.
[General]
Name = Pi CarPlay
# Phone / smartphone. The service bits are also rewritten at runtime by tftpush.
Class = 0x5a020c
DiscoverableTimeout = 0
PairableTimeout = 0
JustWorksRepairing = always

[Policy]
AutoEnable = true
