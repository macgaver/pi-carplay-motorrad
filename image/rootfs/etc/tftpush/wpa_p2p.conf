# wpa_supplicant instance that tftpush starts on the Wi-Fi Direct interface.
ctrl_interface=DIR=/run/wpa_supplicant GROUP=netdev
update_config=0
device_name=Pi CarPlay
# Telephone / smartphone (dual mode)
device_type=10-0050F204-5
config_methods=keypad display virtual_push_button
# The TFT is the group owner; we are always the client.
p2p_go_intent=0
